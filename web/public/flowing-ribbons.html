<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流动丝带 - Flowing Ribbons</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
            padding: 100px;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>流动丝带</h1>
            <div class="subtitle">Flowing Ribbons - 有机流动的曲线艺术</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>
                
                <div class="control-group">
                    <label>Ribbon Count</label>
                    <div class="slider-container">
                        <input type="range" id="ribbonCount" min="3" max="12" step="1" value="6" oninput="updateParam('ribbonCount', this.value)">
                        <span class="value-display" id="ribbonCount-value">6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Amplitude</label>
                    <div class="slider-container">
                        <input type="range" id="amplitude" min="30" max="150" step="5" value="80" oninput="updateParam('amplitude', this.value)">
                        <span class="value-display" id="amplitude-value">80</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Wave Complexity</label>
                    <div class="slider-container">
                        <input type="range" id="complexity" min="1" max="5" step="1" value="3" oninput="updateParam('complexity', this.value)">
                        <span class="value-display" id="complexity-value">3</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Flow Speed</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0" max="100" step="5" value="30" oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">30</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Line Thickness</label>
                    <div class="slider-container">
                        <input type="range" id="thickness" min="1" max="8" step="0.5" value="3" oninput="updateParam('thickness', this.value)">
                        <span class="value-display" id="thickness-value">3</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Opacity</label>
                    <div class="slider-container">
                        <input type="range" id="opacity" min="10" max="100" step="5" value="40" oninput="updateParam('opacity', this.value)">
                        <span class="value-display" id="opacity-value">40</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="saveCanvas('flowing-ribbons', 'png')">Save</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 12345,
            ribbonCount: 6,
            amplitude: 80,
            complexity: 3,
            flowSpeed: 30,
            thickness: 3,
            opacity: 40
        };

        let defaultParams = {...params};
        let ribbons = [];
        let time = 0;
        let canvas;

        // Anthropic brand colors
        const colors = [
            [217, 119, 87],   // Orange
            [106, 155, 204],  // Blue
            [120, 140, 93],   // Green
            [196, 92, 62],    // Deep Orange
            [217, 119, 87],   // Light Orange
            [106, 155, 204]   // Light Blue
        ];

        function setup() {
            canvas = createCanvas(1000, 800);
            canvas.parent('canvas-container');
            document.querySelector('.loading').style.display = 'none';
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            
            ribbons = [];
            time = 0;
            
            // Create ribbons
            for (let i = 0; i < params.ribbonCount; i++) {
                ribbons.push(new Ribbon(i));
            }
            
            background(250, 249, 245);
        }

        function draw() {
            // Semi-transparent clear for trail effect
            if (params.flowSpeed > 0) {
                fill(250, 249, 245, 15);
                noStroke();
                rect(0, 0, width, height);
            }
            
            time += params.flowSpeed * 0.001;
            
            ribbons.forEach(ribbon => {
                ribbon.update();
                ribbon.draw();
            });
        }

        class Ribbon {
            constructor(index) {
                this.index = index;
                this.points = [];
                this.color = colors[index % colors.length];
                this.baseY = (height / (params.ribbonCount + 1)) * (index + 1);
                this.phase = random(TWO_PI);
                this.noiseOffset = random(1000);
            }

            update() {
                this.points = [];
                const segments = 100;
                
                for (let i = 0; i <= segments; i++) {
                    let x = (width / segments) * i;
                    let xNorm = i / segments;
                    
                    // Multi-layer sine waves for organic flow
                    let y = this.baseY;
                    let amp = params.amplitude;
                    
                    for (let layer = 0; layer < params.complexity; layer++) {
                        let freq = (layer + 1) * 2;
                        let phaseShift = this.phase + time * (layer * 0.5 + 1);
                        let layerAmp = amp / (layer + 1);
                        
                        y += sin(xNorm * PI * freq + phaseShift) * layerAmp;
                    }
                    
                    // Add vertical drift
                    y += sin(time * 0.5 + this.index) * 20;
                    
                    this.points.push({x, y});
                }
            }

            draw() {
                let [r, g, b] = this.color;
                let alpha = params.opacity;
                
                // Draw glow
                stroke(r, g, b, alpha * 0.3);
                strokeWeight(params.thickness * 3);
                noFill();
                
                beginShape();
                this.points.forEach((p, i) => {
                    if (i === 0) {
                        vertex(p.x, p.y);
                    } else {
                        // Smooth curve
                        let prev = this.points[i - 1];
                        let cx = (prev.x + p.x) / 2;
                        let cy = (prev.y + p.y) / 2;
                        quadraticVertex(prev.x, prev.y, cx, cy);
                    }
                });
                endShape();
                
                // Draw main line
                stroke(r, g, b, alpha);
                strokeWeight(params.thickness);
                
                beginShape();
                this.points.forEach((p, i) => {
                    if (i === 0) {
                        vertex(p.x, p.y);
                    } else {
                        let prev = this.points[i - 1];
                        let cx = (prev.x + p.x) / 2;
                        let cy = (prev.y + p.y) / 2;
                        quadraticVertex(prev.x, prev.y, cx, cy);
                    }
                });
                endShape();
            }
        }

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            
            if (paramName === 'ribbonCount') {
                initializeSystem();
            }
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};
            
            document.getElementById('ribbonCount').value = params.ribbonCount;
            document.getElementById('ribbonCount-value').textContent = params.ribbonCount;
            document.getElementById('amplitude').value = params.amplitude;
            document.getElementById('amplitude-value').textContent = params.amplitude;
            document.getElementById('complexity').value = params.complexity;
            document.getElementById('complexity-value').textContent = params.complexity;
            document.getElementById('flowSpeed').value = params.flowSpeed;
            document.getElementById('flowSpeed-value').textContent = params.flowSpeed;
            document.getElementById('thickness').value = params.thickness;
            document.getElementById('thickness-value').textContent = params.thickness;
            document.getElementById('opacity').value = params.opacity;
            document.getElementById('opacity-value').textContent = params.opacity;
            
            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
